name: Grove

options:
  bundleIdPrefix: com.emirhanengin
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  DiffCore:
    path: Packages/DiffCore
  # Self-updating. Pinned to a major version: Sparkle's own EdDSA signing is
  # what makes an update trustworthy here, and that contract is the thing that
  # must not change under a `swift package update`.
  #
  # The Swift Package artefact also carries `bin/generate_keys`,
  # `bin/sign_update` and `bin/generate_appcast`, which is where
  # `scripts/release.sh` finds them — there is nothing else to install.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"

    # Sandbox OFF: Grove spawns `git` and `claude`. Xcode 26/27 auto-generate an
    # entitlements file from these settings, so they must be set explicitly —
    # leaving them unset can silently produce a sandboxed app whose spawn fails.
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SELECTED_FILES: NO
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    DEVELOPMENT_TEAM: ""

    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULE_VERIFIER: NO
  configs:
    Debug:
      SWIFT_COMPILATION_MODE: incremental
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Grove:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # The diff renderer, built by `npm --prefix Web run build`. A folder
      # reference — its ~320 lazy-loaded syntax grammars must keep their paths,
      # and a group would flatten them into the bundle root.
      - path: Web/DiffRenderer

        type: folder
        buildPhase: resources
    dependencies:
      - package: DiffCore
        product: DiffCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirhanengin.grove
        PRODUCT_NAME: Grove
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Grove
        CFBundleDisplayName: Grove
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # Grove holds unsaved commit drafts — it must get a chance to flush them.
        NSSupportsSuddenTermination: false
        NSSupportsAutomaticTermination: false
        NSHumanReadableCopyright: ""

        # Updates, read by Sparkle. See RELEASE.md.
        #
        # `SUPublicEDKey` is empty until `bin/generate_keys` has been run once —
        # the private half of that pair lives in the releaser's Keychain and
        # cannot be committed. While it is empty Grove does not start the updater
        # at all and the menu item stays out, rather than letting Sparkle raise a
        # fatal error about a feed it cannot verify. See ``UpdateController``.
        SUPublicEDKey: ""
        # `releases/latest/download/<asset>` is a permanent redirect to that
        # asset on whatever the latest release is, so the feed URL never has to
        # change and nothing outside GitHub has to be hosted.
        SUFeedURL: "https://github.com/itsemirhanengin/grove-git-client/releases/latest/download/appcast.xml"
        SUScheduledCheckInterval: 86400
        # NOT set: `SUEnableAutomaticChecks`. Leaving it out is what makes
        # Sparkle *ask*, on the second launch, before it ever reaches the
        # network on its own. Setting it to true would silently opt every user
        # into a background check they were never offered, which is not a
        # decision Grove gets to make for them.

  GroveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Grove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirhanengin.grove.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Grove:
    build:
      targets:
        Grove: all
        GroveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GroveTests
